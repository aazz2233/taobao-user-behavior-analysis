[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taobao-behavior-analysis"
version = "2.0.0"
description = "淘宝用户行为数据分析：1 亿条行为的 PV/UV、转化漏斗、RFM 与商品维度分析（DuckDB）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
taobao-analysis = "taobao_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
